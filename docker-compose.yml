# ============================================================
# JBI Detection & Segmentation API — Docker Compose
# ============================================================
# Usage:
#   CPU mode:  docker compose --profile cpu up --build
#   GPU mode:  docker compose --profile gpu up --build
# ============================================================

services:
  # ── PostgreSQL Database ──────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: anotasi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Pastibisa123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    restart: unless-stopped

  # ── Kafka (KRaft mode — no Zookeeper) ────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      CLUSTER_ID: fMyPq6lKSAy7zr3N3d4mNw
    # Port 9092 sengaja tidak dipublikasikan ke host: broker pernah terjangkau
    # dari internet. Antar-container cukup lewat kafka:9092 di jaringan compose.
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    restart: unless-stopped

  # ── Kafbat UI (Optional) ─────────────────────────────────
  # Pengganti provectuslabs/kafka-ui yang tidak lagi dipelihara dan punya
  # celah RCE (filter Groovy). Kafbat adalah fork aktifnya.
  # - Image dipin ke digest agar tidak berubah diam-diam; perbarui dengan sengaja.
  # - Hanya bind ke 127.0.0.1. Akses dari luar lewat SSH tunnel:
  #     ssh -L 8080:127.0.0.1:8080 <server>   lalu buka http://localhost:8080
  # - Login wajib. Isi KAFKA_UI_USERNAME dan KAFKA_UI_PASSWORD di .env
  #   (lihat .env.example). Tanpa keduanya, compose berhenti dengan pesan galat.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    profiles: ["cpu", "gpu", "dev"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: jbi-pipeline
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USERNAME:?isi KAFKA_UI_USERNAME di .env}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?isi KAFKA_UI_PASSWORD di .env}
    depends_on:
      kafka:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    restart: unless-stopped

  # ── CPU API Service ──────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["cpu"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:Pastibisa123@db:5432/anotasi_db
      USE_AUTH_FOR_ASSET: "false"
      KAFKA_BROKERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./model_weights:/app/model_weights:ro
      - uploads_data:/app/storage/uploads
      - outputs_data:/app/storage/outputs
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    restart: unless-stopped

  # ── GPU API Service ──────────────────────────────────────
  api-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    profiles: ["gpu"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:Pastibisa123@db:5432/anotasi_db
      USE_AUTH_FOR_ASSET: "false"
      KAFKA_BROKERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./model_weights:/app/model_weights:ro
      - uploads_data:/app/storage/uploads
      - outputs_data:/app/storage/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    restart: unless-stopped

  # ── Detection Worker (GPU) ───────────────────────────────
  detection-worker:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    profiles: ["gpu"]
    command: python run_detection_worker.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:Pastibisa123@db:5432/anotasi_db
      KAFKA_BROKERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./model_weights:/app/model_weights
      - uploads_data:/app/storage/uploads
      - outputs_data:/app/storage/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    restart: unless-stopped

  # ── ASR Worker (GPU) ─────────────────────────────────────
  asr-worker:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    profiles: ["gpu"]
    command: python run_asr_worker.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:Pastibisa123@db:5432/anotasi_db
      KAFKA_BROKERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./model_weights:/app/model_weights
      - uploads_data:/app/storage/uploads
      - outputs_data:/app/storage/outputs
    deploy:
      replicas: 3
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    restart: unless-stopped

  # ── Cropping Worker (GPU) ────────────────────────────────
  cropping-worker:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    profiles: ["gpu"]
    command: python run_cropping_worker.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:Pastibisa123@db:5432/anotasi_db
      KAFKA_BROKERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./model_weights:/app/model_weights
      - uploads_data:/app/storage/uploads
      - outputs_data:/app/storage/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    restart: unless-stopped

  # ── Reconciliation Job ───────────────────────────────────
  reconciliation:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    profiles: ["gpu"]
    command: python run_reconciliation.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:Pastibisa123@db:5432/anotasi_db
      KAFKA_BROKERS: kafka:9092
      RECONCILIATION_INTERVAL_MINUTES: "5"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./model_weights:/app/model_weights
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    restart: unless-stopped

  # ── Object Storage (S3-compatible: SeaweedFS) ────────────
  # Pengganti MinIO. Image MinIO community tidak lagi dipublikasikan, sehingga
  # build terakhir hanya tersisa di cache lokal server. SeaweedFS dipelihara
  # aktif (Apache-2.0) dan mendukung API S3 yang dipakai aplikasi (SigV4,
  # multipart, copy, range read, presigned URL).
  # - Nama variabel tetap MINIO_* karena kode aplikasi membacanya dengan nama itu;
  #   isinya kini alamat dan kredensial S3 SeaweedFS (MINIO_ENDPOINT=seaweedfs:8333).
  # - Tidak dipublikasikan ke internet. Untuk alat admin (rclone, aws cli) dari
  #   luar jaringan compose: ssh -L 8333:127.0.0.1:8333 <server>
  # - -volume.max=0 membuat jumlah volume mengikuti sisa disk (default hanya 8),
  #   -volume.index=leveldb menghemat memori untuk banyak objek.
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -volume.max=0 -volume.index=leveldb -volume.minFreeSpace=20GiB -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:?isi MINIO_ACCESS_KEY di .env}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:?isi MINIO_SECRET_KEY di .env}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - ${SEAWEEDFS_DATA_DIR:-seaweedfs_data}:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333 && wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    restart: unless-stopped

volumes:
  pgdata:
  uploads_data:
  outputs_data:
  seaweedfs_data:
  kafka_data:
